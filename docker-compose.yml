services:
  db:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: evidencedesk
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: evidencedesk
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["evidencedesk-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidencedesk"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  evidencedesk-data:
