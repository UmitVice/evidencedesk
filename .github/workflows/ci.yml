name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
        env:
          POSTGRES_USER: evidencedesk
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: evidencedesk_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U evidencedesk"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.21"
          python-version: "3.13.15"
      - run: npm ci
      - run: uv sync --project apps/api --frozen
      - run: npm run lint && npm run typecheck && npm run build
      - run: npm run check:api
      - run: npm audit --audit-level=moderate
      - run: uv run --project apps/api pip-audit --skip-editable
      - run: python scripts/scan-secrets.py
