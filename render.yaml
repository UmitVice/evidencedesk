# Render Free web service for the FastAPI backend (apps/api). Free instances sleep
# after 15 idle minutes; the first request afterwards waits for a cold start.
# Python comes from apps/api/.python-version. Runtime configuration (DATABASE_URL,
# SERVICE_KEY, ENVIRONMENT, AI_MODE, AI_ENABLED, CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_API_TOKEN, and for OpenAI generation GENERATION_PROVIDER and
# GENERATION_API_KEY) lives only in the Render secret file evidencedesk.env.
services:
  - type: web
    name: evidencedesk-api
    runtime: python
    plan: free
    region: ohio
    rootDir: apps/api
    branch: master
    buildCommand: pip install uv==0.11.21 && uv sync --frozen --no-dev
    startCommand: .venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT --env-file /etc/secrets/evidencedesk.env
    healthCheckPath: /health
    domains:
      - api.evidencedesk.umitvice.com
