# Netlify builds this workspace from the repository root (npm workspaces).
[build]
  command = "npm run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"

# The custom domain is canonical; the BFF only accepts POSTs from APP_ORIGIN.
[[redirects]]
  from = "https://evidencedesk-web.netlify.app/*"
  to = "https://evidencedesk.umitvice.com/:splat"
  status = 301
  force = true
